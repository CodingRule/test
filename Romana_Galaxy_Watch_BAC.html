</style></head><body><div id="shell"><header class="top"><div class="topline"><div><strong id="brand">Română • BAC</strong><div class="mini" id="status">7 eseuri · 3 modele</div></div><div class="tools"><button id="smaller" aria-label="Micșorează textul">A−</button><button id="larger" aria-label="Mărește textul">A+</button><button id="theme" aria-label="Schimbă tema">◐</button></div></div><div class="progress"><div id="fill"></div></div></header><main id="view"></main></div><script>
const DATA=[{"id": "floare", "title": "Floare albastră", "subtitle": "Eseu – particularitățile textului poetic", "paragraphs": ["Poezia „Floare albastră”, de Mihai Eminescu, publicată în revista „Convorbiri literare” în 1873, aparține romantismului și ilustrează opoziția dintre aspirația către cunoașterea absolută și posibilitatea împlinirii prin iubire. Textul este o idilă cu elemente de meditație filozofică, în care cele două viziuni asupra existenței se confruntă prin intermediul dialogului liric.", "O primă trăsătură romantică este antiteza dintre lumea idealurilor înalte, abstracte, și lumea sentimentelor omenești. Bărbatul este atras de depărtări cosmice și de misterele universului, în timp ce fata îl cheamă spre apropiere, natură și fericirea clipei. O altă trăsătură romantică este prezența naturii, care devine spațiul protector al iubirii. Codrul, izvoarele și lumina lunii compun un cadru intim, desprins din realitatea cotidiană.", "Tema poeziei este iubirea, prezentată în relație cu problema cunoașterii și cu incompatibilitatea dintre ideal și real. Titlul conține un simbol romantic: floarea sugerează fragilitatea și frumusețea iubirii, iar culoarea albastră trimite la infinit, visare și aspirație. Împreună, cele două elemente exprimă un ideal afectiv care se dovedește imposibil de păstrat.", "Prima secvență semnificativă este reproșul adresat de fată celui preocupat de cunoașterea universală. Ea observă că iubitul se pierde între stele, nori și depărtări, neglijând fericirea accesibilă. Îndemnul ei de a nu căuta mereu în depărtare exprimă opoziția dintre sensibilitatea feminină și spiritul contemplativ masculin. Replica bărbatului, aparent detașată, ascunde însă o înțelegere târzie a valorii invitației.", "A doua secvență importantă este chemarea la iubire în mijlocul naturii. Fata imaginează o întâlnire într-un peisaj feeric, unde gesturile tandre, jocul și apropierea ar putea transforma existența într-o experiență deplină. Tonul devine familiar și afectuos, iar imaginile vizuale și auditive creează atmosfera unei idile. Totuși, povestea nu se împlinește, iar finalul aduce regretul unei șanse pierdute.", "Compoziția se bazează pe alternanța vocilor lirice și pe contrastul dintre două moduri de a percepe lumea. Limbajul îmbină simbolul, epitetele, repetițiile și imaginile artistice. Muzicalitatea și simplitatea expresiei accentuează sinceritatea sentimentelor, în timp ce meditația finală transformă povestea într-o reflecție despre condiția omului superior.", "Din punct de vedere structural, poezia se organizează în jurul unui dialog imaginar, întrerupt de intervențiile reflexive ale eului liric masculin. Schimbarea tonului, de la chemarea jucăușă la tristețea despărțirii, susține evoluția sentimentului. Finalul nu anulează frumusețea iubirii, ci subliniază imposibilitatea întoarcerii la momentul în care aceasta ar fi putut fi trăită. Astfel, experiența individuală primește o semnificație general umană: omul poate rata prezentul atunci când urmărește fără încetare un ideal îndepărtat.", "Vocea feminină exprimă elanul vieții concrete, iar cea masculină păstrează nostalgia unui ideal inaccesibil. Antiteza conferă poeziei profunzime filozofică.", "În concluzie, „Floare albastră” este reprezentativă pentru romantismul eminescian deoarece reunește iubirea, natura, visarea și antiteza dintre ideal și real. Poezia sugerează că aspirația către absolut poate însemna renunțarea la o fericire apropiată, iar iubirea neîmplinită rămâne o amintire dureroasă."], "words": 454, "type": "essay", "tip": null}, {"id": "harap_part", "title": "Povestea lui Harap-Alb", "subtitle": "Eseu – particularitățile basmului cult", "paragraphs": ["Basmul cult „Povestea lui Harap-Alb”, de Ion Creangă, publicat în revista „Convorbiri literare” în 1877, aparține realismului prin observația vieții și a comportamentului uman, dar păstrează convențiile fabulosului. Opera urmărește formarea unui tânăr care învață să distingă aparența de esență și să devină un conducător responsabil. Fiind un basm cult, textul are autor cunoscut, îmbină fantasticul cu realitatea și individualizează personajele prin limbaj și comportament.", "O primă trăsătură a speciei este prezența formulelor specifice, a cifrelor simbolice și a motivelor tradiționale: împăratul fără urmaș, probele, ajutoarele miraculoase și victoria binelui. O altă trăsătură este caracterul fantastic al întâmplărilor, ilustrat de calul năzdrăvan, de Sfânta Duminică și de prietenii cu însușiri supranaturale. Spre deosebire de eroul basmului popular, protagonistul greșește, se teme și învață treptat, fiind astfel umanizat.", "Tema este maturizarea prin experiență, iar conflictul central se construiește între Harap-Alb și Spân, reprezentant al răului și al imposturii. Titlul este semnificativ prin oximoronul numelui: „harap” sugerează condiția de slugă, în timp ce „alb” evocă noblețea și puritatea. Numele indică situația paradoxală a unui fiu de crai obligat să-și ascundă adevărata identitate pentru a putea evolua.", "O primă secvență relevantă este întâlnirea cu Spânul și coborârea în fântână. Deși tatăl îl avertizase să se ferească de omul spân, tânărul acceptă ajutorul străinului și este păcălit să coboare în fântână. Spânul îl constrânge să-i cedeze identitatea și îl transformă în slujitor. Momentul simbolizează o moarte inițiatică: lipsit de statutul său, eroul începe adevărata învățare a vieții. Naivitatea și neascultarea sunt greșeli necesare devenirii.", "A doua secvență semnificativă este deznodământul. După îndeplinirea probelor, fata împăratului Roș dezvăluie identitatea falsului moștenitor. Spânul îl ucide pe Harap-Alb, iar calul îl pedepsește pe impostor. Prin intervenția fetei și a obiectelor miraculoase, eroul revine la viață. Învierea semnifică încheierea inițierii: tânărul nu mai este naiv, ci pregătit să își asume locul cuvenit.", "Acțiunea respectă succesiunea echilibru inițial, perturbare, probe și restabilirea echilibrului. Naratorul povestește la persoana a III-a, dar intervine prin comentarii, oralitate și umor, ceea ce dă textului o notă personală. Dialogurile dinamizează narațiunea, iar expresiile populare și regionalismele apropie lumea miraculoasă de universul satului moldovenesc. Personajele fantastice au adesea reacții și defecte omenești, devenind memorabile prin contraste comice.", "În plus, personajele secundare funcționează ca trepte ale formării. Sfânta Duminică îl sfătuiește, calul îl apără, iar cei cinci tovarăși îi arată puterea solidarității. Probele nu verifică numai curajul fizic, ci și capacitatea de a cere ajutor, de a-și respecta promisiunile și de a recunoaște valoarea celorlalți. Astfel, succesul nu este rezultatul forței individuale, ci al bunătății și al colaborării.", "În construcția eroului se remarcă și simbolistica drumului. Plecarea de acasă înseamnă desprinderea de siguranța copilăriei, iar trecerea podului marchează intrarea într-un spațiu al încercărilor. Fântâna reprezintă pierderea identității, iar întoarcerea la statutul firesc este posibilă numai după traversarea tuturor probelor. Această succesiune conferă întâmplărilor fantastice sensul unei evoluții interioare. Cititorul observă nu doar ceea ce face personajul, ci mai ales ce descoperă despre oameni și despre sine. Finalul fericit păstrează convenția basmului, dar răsplătește maturizarea, nu simpla apartenență la o familie nobilă. De aceea, povestea poate fi citită și ca o lecție despre responsabilitate.", "O particularitate a stilului lui Creangă este oralitatea. Naratorul folosește proverbe, expresii familiare și intervenții care dau impresia unei povestiri spuse direct ascultătorului. Umorul provine adesea din reacțiile exagerate și din prezentarea firescului în situații miraculoase. Aceste elemente diferențiază opera de un basm popular anonim și îi conferă o voce literară distinctă.", "În concluzie, „Povestea lui Harap-Alb” este un basm cult original prin umanizarea fantasticului, oralitate și umor. Drumul protagonistului reprezintă o inițiere morală, iar victoria finală confirmă că adevărata noblețe se câștigă prin experiență, răbdare și generozitate."], "words": 605, "type": "essay", "tip": null}, {"id": "harap_char", "title": "Povestea lui Harap-Alb", "subtitle": "Eseu – caracterizarea lui Harap-Alb", "paragraphs": ["În basmul cult „Povestea lui Harap-Alb”, publicat de Ion Creangă în 1877, personajul principal parcurge un drum de maturizare care îi transformă naivitatea inițială în înțelepciune. Spre deosebire de eroul idealizat din basmul popular, Harap-Alb este un tânăr cu slăbiciuni omenești, capabil să greșească, să sufere și să învețe. Prin destinul său, autorul transmite ideea că valoarea unui conducător se formează în urma probelor morale.", "Statutul său social se modifică pe parcurs: la început este mezinul craiului, apoi devine sluga Spânului, pentru ca în final să își recapete identitatea și să fie recunoscut ca moștenitor. Din punct de vedere moral, este bun, milos și loial, dar insuficient de experimentat. Psihologic, trece de la nesiguranță și impulsivitate la responsabilitate și încredere în sine. Această evoluție conferă personajului caracter dinamic.", "Trăsătura sa dominantă este bunătatea, evidențiată mai ales prin caracterizare indirectă. Când o bătrână cerșetoare îi cere ajutor, tânărul îi oferă milostenie, fără să știe că aceasta este Sfânta Duminică. Fapta îi aduce sfaturi prețioase pentru alegerea calului și a armelor tatălui. Gestul arată că eroul privește oamenii cu compasiune, dincolo de aparențele sociale. Tot prin fapte se dezvăluie generozitatea față de furnici și albine, pe care le cruță și le ajută, dobândind ulterior sprijinul lor.", "O scenă decisivă pentru evoluția sa este coborârea în fântână. Ignorând avertismentul tatălui de a se feri de Spân, tânărul acceptă însoțirea necunoscutului. Spânul îl păcălește și îi impune să jure supunere, obligându-l să poarte numele Harap-Alb. Episodul evidențiază naivitatea protagonistului, dar marchează și începutul inițierii. El descoperă că încrederea acordată fără discernământ poate avea consecințe grave.", "O a doua scenă semnificativă este finalul, când adevărul este descoperit, iar Spânul îi taie capul eroului. Fata împăratului Roș îl readuce la viață, în timp ce calul îl pedepsește pe impostor. Moartea și învierea au valoare simbolică: vechiul tânăr, lipsit de experiență, dispare, iar în locul lui apare un om matur. Eroul își poate asuma acum identitatea și responsabilitățile care îi revin.", "Caracterizarea directă este realizată prin vorbele naratorului și prin aprecierile celorlalte personaje, iar caracterizarea indirectă rezultă din fapte, gesturi, limbaj și relații. Numele însuși este sugestiv: asocierea dintre „harap”, cu sensul de slugă, și „alb”, simbol al purității, exprimă contrastul dintre condiția exterioară și natura sa nobilă. Relația cu Spânul este una de opoziție, dar și de formare: antagonistul îl supune unor încercări prin care își dezvoltă calitățile.", "Sprijinul oferit de cal, de Sfânta Duminică și de cei cinci tovarăși arată că Harap-Alb nu învinge prin forță excepțională, ci prin capacitatea de a crea legături și de a respecta ajutorul primit. Prietenia, modestia și solidaritatea completează curajul și îl diferențiază de eroii invincibili. El învață să colaboreze și să își stăpânească frica, fără să își piardă omenia.", "Un alt aspect important este raportul dintre curaj și ascultare. La început, Harap-Alb se avântă fără să cântărească suficient consecințele, iar avertismentul părintesc este încălcat. Ulterior, își înțelege limitele și învață să primească sfaturi, inclusiv de la ființe ce par neînsemnate. Această schimbare nu reprezintă slăbiciune, ci dovedește dobândirea discernământului. În mod paradoxal, timpul petrecut în slujba Spânului îl pregătește pentru libertate și pentru responsabilitatea de a conduce.", "Portretul protagonistului se construiește și prin contrast cu antagonistul. Spânul folosește minciuna și amenințarea pentru a obține puterea, în timp ce Harap-Alb câștigă sprijin prin bunătate și promisiuni respectate. De aceea, victoria finală are sens moral. Ea confirmă superioritatea sincerității asupra imposturii și justifică recunoașterea eroului de către ceilalți. În basmul lui Creangă, maturitatea presupune atât inteligență practică, cât și păstrarea unui caracter generos.", "În concluzie, Harap-Alb este un personaj complex, reprezentativ pentru basmul cult al lui Creangă. Transformarea sa din fiu de crai naiv în conducător matur demonstrează că adevărata superioritate morală se obține prin încercări, bunătate și înțelegerea celorlalți."], "words": 620, "type": "essay", "tip": null}, {"id": "moara_part", "title": "Moara cu noroc", "subtitle": "Eseu – particularitățile nuvelei psihologice", "paragraphs": ["Nuvela „Moara cu noroc”, de Ioan Slavici, publicată în volumul „Novele din popor” în 1881, aparține realismului și surprinde degradarea morală a omului dominat de dorința de îmbogățire. Opera este o nuvelă psihologică deoarece urmărește cu atenție conflictul interior al protagonistului și transformările sale sufletești. Acțiunea concentrată, conflictul puternic și numărul relativ redus de personaje susțin apartenența la această specie epică.", "O primă trăsătură realistă este prezentarea veridică a mediului social și economic: hanul aflat la răscruce, drumurile negustorilor și lumea porcarilor conduși de Lică. O a doua trăsătură este construirea personajelor în relație cu împrejurările care le determină comportamentul. Ghiță nu devine rău dintr-odată, ci face compromis după compromis, atras de câștig și intimidat de puterea lui Lică Sămădăul.", "Tema este consecința distrugătoare a patimii banului asupra individului și a familiei. Titlul are valoare ironică: locul numit „Moara cu noroc”, asociat inițial prosperității, devine spațiul nenorocirii. Viziunea moralizatoare este formulată prin cuvintele bătrânei, potrivit căreia liniștea colibei este mai prețioasă decât bogăția. Această idee constituie reperul moral al întregii întâmplări.", "O primă secvență importantă este întâlnirea dintre Ghiță și Lică. Sămădăul se prezintă ca stăpân neoficial al zonei și îi impune cârciumarului să îi accepte autoritatea. Deși înțelege pericolul, Ghiță nu renunță la han, fiind atras de perspectiva îmbogățirii. Din acest moment, frica și lăcomia încep să îi conducă alegerile. El se înarmează, își cumpără câini și devine suspicios, îndepărtându-se treptat de Ana.", "A doua secvență relevantă este finalul tragic. Dorind să îl prindă pe Lică prin intermediul jandarmului Pintea, Ghiță își lasă soția în preajma Sămădăului, folosind-o ca parte a unui plan periculos. Întors la han, orbit de gelozie și vinovăție, o ucide pe Ana, apoi este ucis la rândul său. Lică, urmărit, își provoacă moartea izbindu-se de un copac, iar hanul arde. Distrugerea locului confirmă prăbușirea unei lumi clădite pe compromis.", "Conflictul exterior dintre Ghiță și Lică se dublează de conflictul interior dintre dorința de a rămâne cinstit și tentația banilor. Naratorul relatează la persoana a III-a, cu acces la gândurile și trăirile personajelor, realizând o perspectivă obiectivă. Analiza psihologică se construiește prin observația comportamentelor, prin dialog, monolog interior și gesturi semnificative. Tensiunea crește gradual, pe măsură ce protagonistul pierde controlul asupra propriei vieți.", "Simetria dintre început și final accentuează caracterul moralizator. Vorbele bătrânei deschid și închid simbolic povestea, punând în opoziție cumpătarea și goana după avere. Hanul izolat, situat într-un spațiu al întâlnirilor nesigure, devine un loc al tentației și al amenințării. Atmosfera apăsătoare reflectă destrămarea legăturilor familiale și neliniștea interioară a lui Ghiță.", "Perspectiva narativă și detaliile realiste întăresc impresia de autenticitate. Personajele nu sunt judecate doar după declarații, ci mai ales după deciziile luate în situații-limită. Slavici arată cum frica poate fi transformată în dependență și cum avantajele materiale obținute prin compromis amplifică nevoia altor compromisuri. În acest fel, relația cu Lică devine un mecanism al degradării interioare. Autorul nu prezintă răul ca pe o întâmplare izolată, ci ca pe rezultatul alegerilor repetate.", "Deosebit de importantă este relația dintre Ghiță și Ana. La început, cei doi urmăresc împreună o viață mai bună, dar tăcerea, gelozia și suspiciunea ajung să înlocuiască încrederea. Conflictul familial face vizibilă, în plan concret, criza conștiinței protagonistului. Când Ghiță își abandonează rolul protector, tragedia devine aproape inevitabilă. Nuvela depășește astfel simpla poveste despre bani și devine o analiză a responsabilității individuale.", "Din această perspectivă, finalul nu reprezintă numai pedepsirea personajelor, ci și confirmarea principiului că liniștea sufletească nu poate fi înlocuită prin avere. Drama devine astfel o demonstrație literară despre efectele pierderii măsurii.", "În concluzie, „Moara cu noroc” este o nuvelă realistă și psihologică prin tema socială, construcția conflictelor și analiza treptată a conștiinței. Slavici arată că renunțarea la principiile morale pentru câștig material poate distruge atât individul, cât și familia sa."], "words": 622, "type": "essay", "tip": null}, {"id": "moara_char", "title": "Moara cu noroc", "subtitle": "Eseu – caracterizarea lui Ghiță", "paragraphs": ["Ghiță, personajul principal al nuvelei psihologice „Moara cu noroc”, de Ioan Slavici, publicată în 1881, ilustrează drama omului care își sacrifică echilibrul moral pentru bani. Autorul realizează un portret complex, urmărind modificările conștiinței și ale comportamentului sub presiunea unui mediu periculos. Personajul este realist, deoarece reacțiile lui au motivații sociale și psihologice credibile.", "La început, Ghiță este un cizmar sărac, soțul Anei și tată de familie, preocupat de bunăstarea celor apropiați. El ia în arendă hanul Moara cu noroc, sperând să își depășească situația materială. Statutul social de mic întreprinzător îl pune în contact cu Lică Sămădăul, conducătorul porcarilor din zonă. Moral, protagonistul pornește ca om harnic și responsabil, dar ajunge tot mai necinstit. Psihologic, oscilează între teamă, lăcomie, gelozie și remușcare.", "Trăsătura sa dominantă este slăbiciunea morală în fața banilor, dezvăluită indirect prin alegeri. Prima scenă semnificativă este întâlnirea cu Lică, care îi cere să îi ofere informații despre cei ce trec pe la han. Ghiță înțelege imediat natura amenințătoare a acestuia, dar nu pleacă. În loc să își protejeze familia, începe să accepte regulile Sămădăului. Își cumpără pistoale, angajează o slugă și ia câini de pază, semne ale fricii și ale pierderii liniștii interioare.", "O a doua secvență reprezentativă este deznodământul. Ghiță dorește să contribuie la prinderea lui Lică, însă continuă să fie prins în propriile compromisuri. Își lasă soția alături de Sămădău, apoi se întoarce măcinat de gelozie și de sentimentul trădării. Într-un gest extrem, o ucide pe Ana, iar el însuși este omorât. Episodul reprezintă punctul final al degradării sale: omul care își dorise prosperitate pentru familie ajunge să o distrugă.", "Caracterizarea directă apare în intervențiile naratorului și în opiniile altor personaje, în special ale Anei, care observă schimbarea soțului. Caracterizarea indirectă, mai importantă, se realizează prin fapte, atitudini, relații și reacții. Ghiță devine închis, irascibil și suspicios, își ascunde gândurile și se îndepărtează de soție. Dialogurile tensionate și ezitările subliniază conflictul dintre conștiința vinovată și dorința de câștig.", "Relația cu Lică este esențială pentru construcția personajului. Sămădăul reprezintă puterea bazată pe violență, manipulare și bani, în timp ce Ghiță este omul obișnuit atras treptat în această lume. Deși înțelege că Lică este periculos, protagonistul nu găsește forța de a rupe legătura. Astfel, conflictul exterior se transformă într-un conflict interior, specific nuvelei psihologice.", "Relația cu Ana evidențiază schimbarea sa afectivă. La început, familia constituie motivul muncii și al ambiției, însă ulterior devine victima neîncrederii lui. Încercarea de a obține avere îl face să uite scopul inițial și să aleagă mereu soluția care promite un avantaj imediat. Ghiță rămâne conștient de rău, dar conștiința nu îl mai poate opri; tocmai această contradicție îi accentuează tragismul.", "Pentru înțelegerea personajului este important și raportul dintre libertate și constrângere. Ghiță afirmă uneori că este silit de împrejurări, însă nu este complet lipsit de opțiuni. Ar putea să plece de la han și să revină la o existență modestă, așa cum îl îndeamnă valorile reprezentate de bătrână. Faptul că rămâne arată că tentația câștigului este mai puternică decât instinctul de protecție. În acest sens, tragedia sa are și dimensiunea unei vinovății asumate prin fapte.", "Realismul portretului rezultă din lipsa unei transformări bruște. Ghiță are momente de luciditate și încearcă să se opună influenței lui Lică, dar revine mereu la compromis. Această oscilație face credibilă degradarea psihologică. Cititorul poate înțelege presiunile suportate de el, fără ca înțelegerea să însemne justificarea faptelor sale. Destinul personajului funcționează ca avertisment moral.", "În concluzie, Ghiță este un personaj realist, complex și dinamic, construit prin analiză psihologică. Destinul său demonstrează că goana după îmbogățire, atunci când înlocuiește responsabilitatea și cinstea, conduce la pierderea identității morale și la destrămarea familiei."], "words": 602, "type": "essay", "tip": null}, {"id": "scrisoare_part", "title": "O scrisoare pierdută", "subtitle": "Eseu – particularitățile comediei", "paragraphs": ["Comedia „O scrisoare pierdută”, de I. L. Caragiale, reprezentată pentru prima dată în 1884, este o operă dramatică realistă, în care sunt satirizate moravurile politice și sociale. Textul prezintă lupta pentru putere într-un oraș de provincie, unde interesele personale, șantajul și demagogia înlocuiesc principiile. Comedia provoacă râsul, dar urmărește și îndreptarea defectelor umane prin critică.", "O primă trăsătură a comediei este existența unui conflict comic: pierderea unei scrisori de dragoste declanșează o dispută electorală. O altă trăsătură este utilizarea diverselor forme de comic: de situație, de caracter, de limbaj și de nume. Personajele sunt construite ca tipuri umane recognoscibile, precum demagogul, încornoratul, cocheta sau politicianul lipsit de scrupule. Ridicolul apare din contrastul dintre pretențiile lor și adevăratul comportament.", "Tema piesei este degradarea vieții politice prin corupție, interese și lipsă de moralitate. Titlul numește obiectul care pune în mișcare intriga: o scrisoare de amor trimisă de Ștefan Tipătescu către Zoe Trahanache, soția conducătorului politic local. Ajunsă la Nae Cațavencu, scrisoarea devine instrument de șantaj. Astfel, un obiect intim capătă o putere publică disproporționată.", "O primă secvență relevantă este amenințarea lui Cațavencu, care promite să publice scrisoarea dacă nu primește candidatura dorită. Zoe încearcă să rezolve criza, iar Tipătescu reacționează impulsiv. Zaharia Trahanache, deși aparent liniștit, înțelege jocurile politice și pregătește contramăsuri. Scena pune în evidență ipocrizia și faptul că reputația publică este mai importantă pentru personaje decât adevărul.", "O a doua secvență semnificativă este adunarea electorală, urmată de deznodământ. Candidatul impus de la centru este Agamemnon Dandanache, mai compromis decât rivalii, iar Cațavencu pierde scrisoarea în încăierare. Documentul ajunge din nou la Zoe prin Cetățeanul turmentat. Rămas fără mijlocul de presiune, Cațavencu acceptă să conducă festivitatea în cinstea învingătorului. Împăcarea finală nu arată o schimbare morală, ci adaptarea oportunistă la noua situație.", "Construcția dramatică se bazează pe dialog, monolog, indicații scenice și pe succesiunea rapidă a răsturnărilor de situație. Acțiunea este organizată în patru acte și dezvoltă treptat tensiunea creată de documentul compromițător. Comicul de limbaj apare în greșeli, contradicții și formule pretențioase. De exemplu, discursurile politice sunt pline de expresii fără logică, ceea ce arată ignoranța celor ce pretind să conducă societatea.", "Numele personajelor au, de asemenea, rol satiric: „Cațavencu” sugerează gălăgia, iar „Dandanache” trimite la încurcătură. Contrastul dintre limbajul solemn și interesele meschine amplifică efectul comic. Personajele schimbă rapid alianțe, iar autorul evită o împărțire simplă între buni și răi: aproape toți participă la același mecanism de compromis și manipulare.", "Un element important pentru caracterul satiric al operei îl reprezintă absența unui personaj cu adevărat exemplar. Tipătescu își folosește autoritatea în interes personal, Cațavencu transformă patriotismul în mijloc de șantaj, iar Dandanache obține candidatura printr-un procedeu asemănător. Chiar și aparenta împăcare finală confirmă că nimeni nu urmărește schimbarea regulilor. În spatele conflictului dintre tabere se ascunde aceeași dorință de putere.", "Comicul de situație este amplificat prin circulația scrisorii: un document pierdut ajunge când la adversari, când la cei care încearcă să îl recupereze. Cetățeanul turmentat, care întreabă mereu cu cine să voteze, accentuează confuzia alegătorului într-un sistem dominat de interese. Repetiția, coincidențele și surprizele mențin ritmul alert. Totodată, comicul de caracter evidențiază defecte stabile, iar comicul de limbaj demască distanța dintre cultura pretinsă și ignoranța reală.", "Și indicațiile scenice au un rol esențial, deoarece precizează mișcările, reacțiile și tonul personajelor. Ele contribuie la construirea situațiilor ridicole și permit spectatorului să observe discrepanța dintre intențiile declarate și comportamentul real. Piesa funcționează astfel atât prin replicile rostite, cât și prin spectacolul gesturilor și al relațiilor dintre personaje.", "În concluzie, „O scrisoare pierdută” este o comedie realistă de moravuri, valoroasă prin conflictul bine construit, tipologiile umane și varietatea comicului. Caragiale demonstrează că lupta politică devine ridicolă atunci când ambiția și interesul personal iau locul competenței și al responsabilității."], "words": 616, "type": "essay", "tip": null}, {"id": "scrisoare_char", "title": "O scrisoare pierdută", "subtitle": "Eseu – caracterizarea lui Zaharia Trahanache", "paragraphs": ["Zaharia Trahanache este unul dintre personajele principale ale comediei „O scrisoare pierdută”, de I. L. Caragiale, reprezentată în 1884. Prin acest personaj, autorul satirizează politicianul experimentat, abil în jocurile de culise și preocupat de conservarea propriei influențe. Trahanache provoacă râsul prin contrastul dintre atitudinea calmă, aparent naivă, și capacitatea de a controla situațiile tensionate.", "Statutul său social este privilegiat: conduce mai multe comitete și organizații politice din județ și este unul dintre liderii grupării aflate la putere. În plan familial, este soțul Zoei și prietenul apropiat al prefectului Ștefan Tipătescu. Moral, pare conciliant și respectuos față de prietenie, dar acceptă compromisurile politice. Psihologic, stăpânirea de sine și răbdarea îl fac diferit de personajele impulsive.", "Trăsătura sa dominantă este viclenia disimulată sub aparența bonomiei. Prima scenă semnificativă este discuția în care îi povestește lui Tipătescu despre scrisoarea compromițătoare aflată la Cațavencu. În loc să reacționeze violent, el tratează documentul ca pe un fals și repetă ideea că trebuie să existe „puțintică răbdare”. Calmului său i se opune agitația prefectului. Scena poate fi citită atât ca semn al naivității conjugale, cât și ca dovadă a inteligenței practice prin care evită un scandal public.", "A doua scenă relevantă este momentul în care Trahanache găsește o poliță falsificată de Cațavencu și o folosește pentru a-l combate. Gestul demonstrează că știe să lupte cu adversarii folosind propriile lor mijloace. În aparență preocupat de principii, el recurge la presiune și la manevre de culise. Prin această contradicție, dramaturgul evidențiază mecanismele unei politici în care interesele de grup contează mai mult decât legea.", "Caracterizarea directă se realizează prin didascalii, prin replicile celorlalte personaje și prin autocaracterizare. Caracterizarea indirectă se desprinde din limbaj, fapte, relații și reacții. Ticurile verbale, în special formula „ai puțintică răbdare”, exprimă calmul afișat, dar și strategia de a câștiga timp. Personajul apelează frecvent la citate și formulări pretențioase, uneori nepotrivite, fapt ce susține comicul de limbaj.", "Numele său are semnificație sugestivă. Prenumele „Zaharia” evocă vârsta și experiența, iar numele „Trahanache” trimite la ideea de cocă moale, ușor de modelat. Totuși, personajul nu este doar maleabil, ci dovedește abilitatea de a-i manevra pe ceilalți. Se conturează astfel tipul încornoratului aparent credul, combinat cu tipul politicianului abil și interesat de influență.", "Relația cu Zoe și Tipătescu evidențiază ipocrizia lumii prezentate. Trahanache apără unitatea grupului politic, preferând să ignore sau să minimalizeze adevărul compromițător. Prietenia și onoarea sunt invocate solemn, însă devin instrumente pentru menținerea avantajelor. De asemenea, în raport cu adversarul Cațavencu, personajul trece de la politețe la contraatac eficient, fără să își piardă cumpătul.", "În cadrul conflictului dramatic, Trahanache joacă rolul stabilizatorului aparent. În timp ce ceilalți reacționează prin amenințări sau panică, el preferă să adune informații și să acționeze în momentul favorabil. Această atitudine îi conferă un avantaj în disputa politică și face ca bonomia lui să nu poată fi confundată cu lipsa de inteligență. Totodată, refuzul de a clarifica relația dintre Zoe și Tipătescu poate indica interesul de a păstra aparențele și echilibrul grupului.", "Comicul personajului este intensificat de discrepanța dintre discurs și comportament. Trahanache invocă moralitatea, prietenia și datoria civică, dar tolerează manevre și falsuri când îi servesc interesul. Astfel, el nu este un simplu soț înșelat, ci o figură reprezentativă pentru politica de culise. Prin această ambiguitate, Caragiale creează un personaj credibil și ridicol în același timp.", "Din punctul de vedere al mijloacelor dramaturgice, personajul este definit în special prin dialog și prin felul în care reacționează la replicile altora. Lipsa unui narator face ca spectatorul să descopere treptat diferența dintre ceea ce susține Trahanache și ceea ce urmărește de fapt.", "În concluzie, Zaharia Trahanache este un personaj comic reprezentativ pentru universul lui Caragiale, construit prin contradicții, limbaj și gesturi semnificative. Aparența naivității ascunde pragmatismul unui politician care cunoaște regulile jocului, iar portretul său contribuie la satirizarea moravurilor publice."], "words": 629, "type": "essay", "tip": null}, {"id": "persp_obj", "title": "Perspectivă narativă obiectivă", "subtitle": "Subiectul al II-lea", "paragraphs": ["Perspectiva narativă reprezintă punctul de vedere al naratorului în raport cu universul diegetic, adică viziunea acestuia asupra lumii prezentate.", "În fragmentul extras din opera „[TITLUL]”, scrisă de [AUTORUL], perspectiva narativă este obiectivă, întrucât narațiunea este heterodiegetică, realizată la persoana a III-a. Acest lucru este evidențiat de forme verbale precum „[VERB 1]”, „[VERB 2]” și de pronume precum „[PRONUME]”, prezente în fragment.", "Textul prezintă [REZUMATUL FRAGMENTULUI ÎN 2–3 RÂNDURI: CINE PARTICIPĂ, CE SE ÎNTÂMPLĂ ȘI ÎN CE CONTEXT].", "Perspectiva obiectivă presupune un narator detașat de acțiune, care relatează evenimentele fără să participe ca personaj și care poate cunoaște mai mult decât personajele. Dacă fragmentul oferă acces la gândurile și sentimentele mai multor personaje, naratorul poate fi considerat omniscient și omniprezent, cu focalizare zero și viziune „din spate”.", "Prin urmare, în fragmentul analizat, relatarea la persoana a III-a și poziția exterioară a naratorului susțin perspectiva narativă obiectivă."], "words": 146, "type": "model", "tip": "Înlocuiește parantezele cu exemple exacte din fragment. Nu afirma automat omnisciența dacă naratorul nu cunoaște interioritatea personajelor."}, {"id": "persp_sub", "title": "Perspectivă narativă subiectivă", "subtitle": "Subiectul al II-lea", "paragraphs": ["Perspectiva narativă reprezintă punctul de vedere al naratorului în raport cu universul diegetic, adică viziunea sa asupra lumii prezentate.", "În fragmentul extras din opera „[TITLUL]”, scrisă de [AUTORUL], perspectiva narativă este subiectivă, deoarece narațiunea este homodiegetică, realizată la persoana I. Mărcile lexico-gramaticale ale subiectivității sunt verbele „[VERB 1]”, „[VERB 2]” și pronumele „[PRONUME]”, care indică participarea naratorului la întâmplări.", "În fragment este prezentată [REZUMATUL ÎN 2–3 RÂNDURI: CE TRĂIEȘTE NARATORUL, CUM REACȚIONEAZĂ ȘI CE EVENIMENTE SUNT RELATATE].", "Perspectiva subiectivă presupune un narator-personaj care transmite experiențele prin propriile percepții, emoții și amintiri. Cititorul descoperă întâmplările printr-un singur unghi, informațiile fiind limitate la ceea ce naratorul știe, vede sau înțelege. Astfel, poate fi identificată focalizarea internă și viziunea „cu”, iar relatarea dobândește autenticitate prin mărturisire.", "Prin urmare, perspectiva narativă este subiectivă, întrucât naratorul participă la acțiune și prezintă realitatea prin filtrul conștiinței sale."], "words": 142, "type": "model", "tip": "Folosește verbe și pronume la persoana I din fragment, nu exemple inventate."}, {"id": "character_model", "title": "Caracterizarea personajului", "subtitle": "Subiectul al II-lea", "paragraphs": ["Personajul literar este o creație a autorului prin care acesta exprimă o viziune asupra lumii, fiind individualizat prin fapte, relații, limbaj și comportament.", "Fragmentul extras din opera „[TITLUL]”, scrisă de [AUTORUL], prezintă [TEMA SAU IDEEA CENTRALĂ A FRAGMENTULUI]. În centrul întâmplărilor se află personajul [NUMELE PERSONAJULUI], caracterizat prin [TRĂSĂTURA PRINCIPALĂ].", "Portretul său [FIZIC / MORAL] este conturat prin caracterizare directă, realizată de [NARATOR / ALTE PERSONAJE / PERSONAJUL ÎNSUȘI]. De exemplu, secvența „[CITAT SCURT]” sugerează [EXPLICAȚIA TRĂSĂTURII].", "Un rol important îl are și caracterizarea indirectă, rezultată din fapte, gesturi, reacții, limbaj și relații cu ceilalți. Prin faptul că [FAPTĂ CONCRETĂ DIN TEXT], personajul demonstrează [TRĂSĂTURĂ + EXPLICAȚIE]. De asemenea, replica „[CITAT SCURT]” evidențiază [TRĂSĂTURĂ], iar relația cu [ALT PERSONAJ] pune în lumină [ATITUDINEA SA].", "În concluzie, prin îmbinarea mijloacelor de caracterizare directă și indirectă, autorul realizează portretul unui personaj [DOUĂ TRĂSĂTURI], relevant pentru semnificația fragmentului."], "words": 141, "type": "model", "tip": "Dacă fragmentul nu include caracterizare directă, precizează acest lucru și dezvoltă doar mijloacele care apar efectiv în text."}];

function render(){document.documentElement.style.setProperty('--reading',font+'px');document.body.classList.toggle('light',light);const id=decodeURIComponent(location.hash.slice(1));const d=DATA.find(x=>x.id===id);current=d||null;$('#fill').style.width='0%';if(!d){$('#brand').textContent='Română • BAC';$('#status').textContent='7 eseuri · 3 modele';const a=DATA.filter(x=>x.type==='essay'),b=DATA.filter(x=>x.type==='model');const groups=[['Eseuri BAC',a],['Subiectul al II-lea',b]];view.innerHTML='<div class="eyebrow">Galaxy Watch · Offline</div><h1>Biblioteca de eseuri</h1><p class="intro">Alege un eseu sau un model. Folosește A− și A+ pentru dimensiunea textului. Progresul se afișează sus.</p>'+groups.map(([title,arr])=>'<h2>'+title+'</h2>'+arr.map(x=>'<button class="tile" data-open="'+x.id+'"><b>'+escapeHtml(x.title)+'</b><small>'+escapeHtml(x.subtitle)+(x.type==='essay'?' · '+x.words+' cuvinte':'')+'</small></button>').join('')).join('');}else{$('#brand').textContent='‹ Biblioteca';$('#status').textContent=d.type==='essay'?d.words+' cuvinte':'Model de completat';let idx=DATA.findIndex(x=>x.id===d.id);view.innerHTML='<div class="eyebrow">'+(d.type==='essay'?'Eseu BAC':'Subiectul al II-lea')+'</div><h1 class="article-title">'+escapeHtml(d.title)+'</h1><div class="article-sub">'+escapeHtml(d.subtitle)+'</div>'+(d.tip?'<div class="note">'+escapeHtml(d.tip)+'</div>':'')+'<article class="reader">'+d.paragraphs.map(p=>'<p>'+escapeHtml(p)+'</p>').join('')+'</article><div class="nav-bottom"><button class="back" data-home>⌂ Meniu</button>'+(idx>0?'<button class="next" data-open="'+DATA[idx-1].id+'">←</button>':'')+(idx<DATA.length-1?'<button class="next" data-open="'+DATA[idx+1].id+'">→</button>':'')+'</div>'; } window.scrollTo(0,0);}
function updateProgress(){const h=document.documentElement;const max=h.scrollHeight-innerHeight;$('#fill').style.width=(max>0?Math.min(100,Math.max(0,scrollY/max*100)):0)+'%'}
view.addEventListener('click',e=>{const btn=e.target.closest('[data-open],[data-home]');if(!btn)return;location.hash=btn.dataset.open||'';if(!btn.dataset.open){history.replaceState(null,'',location.pathname+location.search);render()}});
$('#brand').addEventListener('click',()=>{location.hash='';render()});$('#smaller').onclick=()=>{font=Math.max(13,font-2);localStorage.setItem('watch-font',font);render()};$('#larger').onclick=()=>{font=Math.min(29,font+2);localStorage.setItem('watch-font',font);render()};$('#theme').onclick=()=>{light=!light;localStorage.setItem('watch-light',light?'1':'0');render()};addEventListener('hashchange',render);addEventListener('scroll',updateProgress,{passive:true});addEventListener('resize',updateProgress);render();
</script></body></html>
